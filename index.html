<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prototype">
<meta name="description" content="Know what you can still spend this week.">
<title>Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="styles.css?v=45">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6474FF"/>
      <stop offset=".55" stop-color="#3BCFBF"/>
      <stop offset="1" stop-color="#FF9FBD"/>
    </linearGradient>
  </defs>
</svg>

<div class="app" id="app" data-mode="setup">
  <main id="views"></main>

  <div class="dock">
    <nav class="tabbar" aria-label="App sections">
      <span class="tab-pill" aria-hidden="true"></span>
      <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-5.5H9V20H4z"/></svg>Home</button>
      <button data-tab="deals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5V4h8.5l8.5 8.5-8 8z"/><circle cx="8" cy="8.5" r="1.4"/></svg>Deals</button>
      <button data-tab="recap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M11 20V5M17 20v-5M3 20h18"/></svg>Recap</button>
    </nav>
    <button class="log-btn" data-log aria-label="Log a purchase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  <div class="turn" aria-hidden="true">
    <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
    <b>Turn your phone upright</b>
    <span>Prototype is made for holding your phone the normal way. (On a computer, make the window taller.)</span>
  </div>
</div>

<script type="module" src="js/app.js?v=45"></script>
</body>
</html>
